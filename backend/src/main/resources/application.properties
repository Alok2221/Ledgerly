spring.application.name=ledgerly

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledgerly}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ledgerly}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}

ledgerly.jwt.secret=${LEDGERLY_JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1kZXYtb25seS1jaGFuZ2UtaW4tcHJvZC0xMjM0NTY=}
ledgerly.jwt.expiration-ms=${LEDGERLY_JWT_EXPIRATION_MS:86400000}
ledgerly.cors.allowed-origins=${LEDGERLY_CORS_ORIGINS:http://localhost:4200,http://localhost}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
